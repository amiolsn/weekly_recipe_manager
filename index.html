<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1週間献立マネージャー</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h1>🍴 1週間分を作成する</h1>
        <p style="text-align: center;">主菜と副菜のバランスを考えた1週間分を自動作成します。</p>

        <button id="generate-btn">1週間分を作成する</button>

        <div id="weekly-menu" class="weekly-grid"></div>

        <div class="shopping-card">
            <h2>🛒 買い物リスト</h2>
            <ul id="shopping-list">
                <li>ボタンを押すと必要な食材が表示されます</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
